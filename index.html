<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Icons: drawn anywhere with <svg><use href="#icon-name"/></svg> -->
  <svg style="display: none">
    <symbol id="icon-logo"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="0.6" fill="currentColor"/></symbol>
    <symbol id="icon-home"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"/></symbol>
    <symbol id="icon-plus"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 7.5v9M7.5 12h9"/></symbol>
    <symbol id="icon-heart"><path d="M12 21s-8.5-5.4-8.5-11.3A4.7 4.7 0 0112 6.6a4.7 4.7 0 018.5 3.1C20.5 15.6 12 21 12 21z"/></symbol>
    <symbol id="icon-comment"><path d="M21 12a9 9 0 01-13.5 7.8L3 21l1.2-4.5A9 9 0 1121 12z"/></symbol>
    <symbol id="icon-share"><path d="M22 3L9.5 13.5M22 3l-7 19-5.5-8.5L1 8z"/></symbol>
    <symbol id="icon-bookmark"><path d="M6 3h12v18l-6-5-6 5z"/></symbol>
    <symbol id="icon-trash"><path d="M3 6h18M8 6V3.5h8V6M5.5 6l1 15h11l1-15M10 10v7M14 10v7"/></symbol>
    <symbol id="icon-close"><path d="M5 5l14 14M19 5L5 19"/></symbol>
    <symbol id="icon-image"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 16l-5-5-9 9"/></symbol>
  </svg>

  <!-- Sidebar (desktop) / bottom bar (mobile) -->
  <nav class="sidebar">
    <button class="brand" data-action="home">
      <span class="brand__text">Instagram</span>
      <span class="brand__icon" data-icon="logo"></span>
    </button>
    <ul class="menu">
      <li><button class="menu__item is-active" data-action="home"><span data-icon="home"></span><span class="menu__label">Home</span></button></li>
      <li><button class="menu__item" data-action="create"><span data-icon="plus"></span><span class="menu__label">Create</span></button></li>
    </ul>
  </nav>

  <!-- Top bar (mobile only) -->
  <header class="topbar">
    <span class="brand__text">Instagram</span>
  </header>

  <main class="main">
    <div class="feed">
      <div class="stories" id="stories"></div>
      <div id="posts"></div>
    </div>
  </main>

  <!-- Story viewer -->
  <div class="story-viewer" id="storyViewer" hidden>
    <button class="story-viewer__close" data-action="story-close" aria-label="Close"><span data-icon="close"></span></button>
    <div class="story">
      <div class="story__bar" id="storyBar"></div>
      <div class="story__head">
        <img id="storyAvatar" alt="">
        <b id="storyUser"></b>
      </div>
      <img class="story__img" id="storyImg" alt="">
      <button class="story__zone story__zone--prev" data-action="story-prev" aria-label="Previous story"></button>
      <button class="story__zone story__zone--next" data-action="story-next" aria-label="Next story"></button>
    </div>
  </div>

  <!-- Single post -->
  <div class="modal" id="postModal" hidden>
    <div class="modal__post" id="postModalBody"></div>
  </div>

  <!-- Create post -->
  <div class="modal" id="createModal" hidden>
    <form class="create" id="createForm">
      <div class="create__head">
        <button type="button" class="link-btn link-btn--muted" data-action="close-modal">Cancel</button>
        <b>Create new post</b>
        <button type="submit" class="link-btn" id="shareBtn" disabled>Share</button>
      </div>
      <label class="create__drop">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <img id="createPreview" alt="" hidden>
        <span class="create__hint" id="createHint">
          <span data-icon="image"></span>
          Select a photo from your computer
        </span>
      </label>
      <textarea class="create__caption" id="captionInput" placeholder="Write a caption..." maxlength="300" rows="3"></textarea>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
