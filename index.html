<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista Lab — Task Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <a href="#" class="logo">
      <span class="logo__mark"><span>v</span></span>
      <span class="logo__text">Vista Lab</span>
    </a>
    <div class="avatar" title="Aqeel">A</div>
  </header>

  <main class="container">
    <h1 class="greeting">Hello, <span class="greeting__name">Aqeel</span> , <span class="greeting__muted">Start planning today</span></h1>

    <section class="board">
      <!-- Left: date + calendar -->
      <aside class="side">
        <p class="side__day" id="dayName">Sunday</p>
        <p class="side__date" id="fullDate">04, April 2024</p>

        <div class="calendar">
          <div class="calendar__head">
            <button class="calendar__nav" id="prevMonth" aria-label="Previous month">‹</button>
            <span id="monthName">April</span>
            <button class="calendar__nav" id="nextMonth" aria-label="Next month">›</button>
          </div>
          <div class="calendar__grid" id="calendar"></div>
        </div>
      </aside>

      <!-- Right: tasks -->
      <div class="tasks">
        <form class="task-form" id="taskForm">
          <input class="task-form__input task-form__title" id="taskTitle" type="text" placeholder="Type Title Of Task" required>
          <input class="task-form__input task-form__detail" id="taskDetail" type="text" placeholder="Detail Of Your Task">
          <button class="task-form__add" type="submit" aria-label="Add task">+</button>
        </form>

        <div class="toolbar">
          <label class="select">
            <select id="categoryFilter">
              <option value="all">By category</option>
              <option value="study">Study</option>
              <option value="work">Work</option>
              <option value="personal">Personal</option>
            </select>
          </label>
          <label class="select">
            <select id="priorityFilter">
              <option value="all">By priority</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </label>
          <label class="search">
            <input type="text" id="search" placeholder="Search by name">
            <svg viewBox="0 0 24 24" width="12" height="12"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </label>
        </div>

        <ul class="task-list" id="taskList"></ul>
        <p class="empty" id="emptyMsg" hidden>No tasks found</p>

        <button class="load-more" id="loadMore">Load more</button>
      </div>

      <!-- Bottom stats -->
      <div class="stats">
        <div class="stat stat--completed">
          <p class="stat__label">Completed<br>Tasks</p>
          <p class="stat__value" id="completedCount">04</p>
        </div>
        <div class="stat stat--pending">
          <p class="stat__label">Pending<br>Tasks</p>
          <p class="stat__value" id="pendingCount">15</p>
        </div>
        <div class="summary">
          <div>
            <p class="summary__label">Tasks created</p>
            <p class="summary__value" id="createdCount">1,500</p>
          </div>
          <div class="summary__users">
            <p><span class="summary__accent">25k+</span> Active Users</p>
            <div class="faces">
              <span style="--c:#7b8cde">JS</span>
              <span style="--c:#5a6b7d">MK</span>
              <span style="--c:#3c8dbc">AL</span>
              <span style="--c:#1f2329">RT</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <a href="#" class="logo logo--small">
      <span class="logo__mark"><span>v</span></span>
      <span class="logo__text">Vista Lab</span>
    </a>
    <p class="footer__copy">© 2024 Aqeel Shahzad. All Rights Reserved.</p>
    <div class="socials">
      <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3c-2.8 0-4 1.8-4 4.3V10H7v4h3v8h4v-8h3l1-4h-4V8.5c0-.3.2-.5.5-.5z"/></svg></a>
      <a href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M4 9h4v12H4zM6 3a2 2 0 110 4 2 2 0 010-4zm4 6h3.8v1.7c.6-1 1.9-2 3.9-2 4 0 4.3 2.6 4.3 6V21h-4v-5.5c0-1.4 0-3.2-2-3.2s-2.2 1.5-2.2 3.1V21H10z"/></svg></a>
      <a href="#" aria-label="Twitter"><svg viewBox="0 0 24 24"><path d="M22 5.9c-.7.3-1.5.5-2.4.6.9-.5 1.5-1.3 1.8-2.3-.8.5-1.7.8-2.6 1a4.1 4.1 0 00-7 3.7A11.6 11.6 0 013.4 4.6a4.1 4.1 0 001.3 5.5c-.7 0-1.3-.2-1.9-.5 0 2 1.4 3.7 3.3 4.1-.6.2-1.2.2-1.9.1.5 1.6 2.1 2.8 3.9 2.9A8.3 8.3 0 012 18.4 11.7 11.7 0 008.3 20c7.5 0 11.7-6.3 11.7-11.7v-.5c.8-.6 1.5-1.3 2-2.1z"/></svg></a>
      <a href="#" aria-label="GitHub"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 015 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.7-4.6 4.9.4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0012 2z"/></svg></a>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
